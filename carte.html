<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de visite digitale — Ohmegato</title>
<meta name="description" content="Carte de visite digitale des équipes Ohmegato — Homemade Baking by Alima.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/carte.css">
</head>
<body class="carte-page">

<div class="carte__pattern" aria-hidden="true"></div>

<main class="carte">

  <div class="carte__photo">
    <img id="cartePhotoImg" alt="" hidden>
    <span id="carteInitials" class="carte__initials"></span>
    <span class="carte__badge">
      <img src="assets/images/logo.png" alt="Ohmegato">
    </span>
  </div>

  <h1 class="carte__name" id="carteName">Prénom Nom</h1>
  <p class="carte__role" id="carteRole">Fonction</p>
  <p class="carte__org">Ohmegato</p>

  <div class="carte__divider" aria-hidden="true">
    <span></span>
    <img src="assets/images/divider-heart.png" alt="">
    <span></span>
  </div>

  <div class="carte__links">

    <a class="carte__pill" id="cartePhone" href="#">
      <span class="carte__icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v4a2 2 0 0 1-2 2C9 21 3 15 3 6a2 2 0 0 1 1-2z"/></svg>
      </span>
      <span class="carte__pillText"><strong>Appeler</strong> <i>•</i> <span id="cartePhoneText">—</span></span>
    </a>

    <a class="carte__pill" id="carteEmail" href="#">
      <span class="carte__icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>
      </span>
      <span class="carte__pillText"><strong>Email</strong> <i>•</i> <span id="carteEmailText">—</span></span>
    </a>

    <a class="carte__pill" id="carteWhatsapp" href="#" target="_blank" rel="noopener">
      <span class="carte__icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.7-1.2A9 9 0 1 0 12 3z"/><path d="M8.5 8.8c.2-.5.5-.5.8-.5h.6c.2 0 .5 0 .7.5.2.5.7 1.6.7 1.8.1.1.1.3 0 .4-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.6 1 1.3 1.7 2.3 2.2.2.1.4.1.5-.1.2-.2.6-.7.8-.9.2-.2.3-.2.6-.1.2.1 1.5.7 1.8.8.2.1.4.2.4.3 0 .2 0 .9-.3 1.3-.3.4-1.2.9-1.7.9-.5 0-1.2-.1-3.1-1-2.6-1.1-4.3-3.7-4.4-3.9-.1-.2-1-1.3-1-2.5 0-1.2.6-1.8.8-2z" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="carte__pillText"><strong>WhatsApp</strong> <i>•</i> <span>Discutons ensemble</span></span>
    </a>

    <a class="carte__pill" id="carteWebsite" href="#" target="_blank" rel="noopener">
      <span class="carte__icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
      </span>
      <span class="carte__pillText"><strong>Visiter le site</strong> <i>•</i> <span id="carteWebsiteText">—</span></span>
    </a>

  </div>

  <button class="carte__cta" id="carteSave" type="button">
    <span class="carte__icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20H4a1 1 0 0 1-1-1v-1a5 5 0 0 1 5-5h1.5"/><circle cx="9" cy="7" r="4"/><path d="M17 11v6M14 14h6"/></svg>
    </span>
    Enregistrer dans mes contacts
  </button>

  <div class="carte__brand">
    <span class="carte__brandIcon">
      <img src="assets/images/logo.png" alt="Ohmegato">
    </span>
    <span class="carte__brandText">
      <strong>Ohmegato</strong>
      <em>Homemade baking</em>
      <small>By Alima</small>
    </span>
  </div>

  <p class="carte__footer">© <span id="carteYear"></span> Ohmegato · Carte de visite digitale</p>

</main>

<script src="js/team.js"></script>
<script src="js/carte.js"></script>
</body>
</html>
